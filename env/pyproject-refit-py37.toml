# ARCHIVAL environment — the ORIGINAL PAPER ENV (Python 3.7.9), pins from
# New\Replication\requirements_iml.txt. Use ONLY for the Tier-3 forecast refit or bit-faithful
# reproduction. Keep this as a SEPARATE Poetry project (its own folder + venv) so it never
# pollutes the primary 3.9 env (../pyproject.toml).
#
# CAVEATS:
#   - The recorded list is a conda/linux-64 explicit export; versions are reused but build
#     details differ on Windows.
#   - This env intentionally has NO `anatomy` (the GPBSV step ran in the 3.9 env).
#   - tensorflow 2.4.1 + autokeras 1.0.12 + keras-tuner 1.0.2 pin tightly; if Poetry's resolver
#     balks, install those three via:
#       poetry run pip install "tensorflow==2.4.1" "autokeras==1.0.12" "keras-tuner==1.0.2"
#   - tensorflow 2.4.1 requires Python <=3.8, hence python = ">=3.7,<3.8".

[tool.poetry]
name = "anatomy-replication-refit"
version = "1.0.0"
description = "Archival Python 3.7.9 env for the Tier-3 forecast refit (original paper environment)"
authors = ["Christian <tegretol_lc@hotmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.7,<3.8"
numpy = "1.19.4"
pandas = "1.1.5"
scipy = "1.7.3"
scikit-learn = "0.24.1"
statsmodels = "0.12.2"
xgboost = "1.3.3"
joblib = "1.0.0"
tqdm = "4.56.0"
matplotlib = "3.5.1"
seaborn = "0.11.1"
openpyxl = "3.0.5"
XlsxWriter = "1.3.7"
requests = "2.25.1"
h5py = "2.10.0"
shap = "0.40.0"
tensorflow = "2.4.1"
keras-tuner = "1.0.2"
autokeras = "1.0.12"
torch = "1.7.1"
lightgbm = "2.3.1"
arch = "4.19"
pwlf = "2.0.4"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
